name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action Terraform à exécuter'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: terraform-pipeline
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  TF_VERSION: 1.10.5
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  test-and-lint:
    name: 🐍 Test Python, Formatting & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Lint with Ruff
        run: ruff check .

      - name: Run unit tests with pytest
        run: pytest tests/ -v

      - name: Run Checkov IaC scan
        run: checkov --config-file .checkov.yaml -d terraform/workloads

  terraform:
    name: 🏗️ Terraform (${{ github.event.inputs.action || 'plan' }})
    needs: test-and-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/workloads
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda package
        working-directory: .
        run: bash scripts/build.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.action == 'plan' || github.event.inputs.action == null }}
        run: terraform plan -no-color

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -auto-approve

      - name: Initialize Database Schema
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          LAMBDA_NAME=$(terraform output -raw lambda_db_init_name)
          aws lambda invoke --function-name "$LAMBDA_NAME" /tmp/out.json
          cat /tmp/out.json

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          BUCKET=$(terraform output -raw s3_landing_bucket 2>/dev/null || echo "")
          if [ -n "$BUCKET" ]; then
            aws s3 rm "s3://$BUCKET" --recursive || true
          fi
          terraform destroy -auto-approve